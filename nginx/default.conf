upstream django {
    server backend:8000;
}

upstream nextjs {
    server frontend:3000;
}

# Przekierowanie HTTP → HTTPS
server {
    listen 80;
    server_name prokomserwis.pl www.prokomserwis.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — strona główna (Next.js)
server {
    listen 443 ssl http2;
    server_name prokomserwis.pl www.prokomserwis.pl;

    ssl_certificate     /etc/letsencrypt/live/prokomserwis.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prokomserwis.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20M;

    # Pliki statyczne Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Pliki mediów Django (uploads)
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # API Django
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wszystko inne → Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
