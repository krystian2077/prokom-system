# prokom-tech on the shared VPS (webh.pl) — services common to both environments.
# Docs: docs/tech/WDROZENIE.md (how to deploy), docs/tech/MIGRACJA-VPS.md §4 (why it looks like this).
# Always used together with an environment overlay, from the deploy directory /srv/prokom/prokom-tech:
#   prod:    docker compose --env-file .env.prod    -f compose.vps.yml -f compose.prod.yml    up -d
#   staging: docker compose --env-file .env.staging -f compose.vps.yml -f compose.staging.yml up -d
# The shared Nginx (prokom-web, project prokom-proxy) reaches only `gateway`, by its container name
# prokom-tech-<stack>-gateway-1:80 on the external network `prokom-proxy`. Database and Redis have
# no ports outside the stack. Images come from GitHub Actions (.github/workflows/obrazy.yml);
# nothing is built on the server.
# The old Hetzner setup (docker-compose.prod.yml, nginx/) stays untouched until the rollback window ends.

x-logging: &logging # json logs with rotation, so they never fill the disk
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    # Same major version as on Hetzner (16.13): the pg_dump -Fc from there restores 1:1.
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prokom
      # Hex only (openssl rand -hex 24): it goes into DATABASE_URL as is.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      # POSTGRES_DB: set by the overlay (prokom_tech_prod / prokom_tech_staging)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prokom']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in the env file}']
    environment:
      # redis-cli reads the password from here, so it never shows up in the process list.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the env file}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    image: ghcr.io/krystian2077/prokom-tech-backend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG (full commit SHA)}
    restart: unless-stopped
    # env_file: set by the overlay — each environment has its own file, never shared.
    # The image CMD runs gunicorn only; migrate and collectstatic run in scripts/vps/deploy.sh
    # (on prod migrate only after a backup).
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Django forces HTTPS (SECURE_SSL_REDIRECT) and checks ALLOWED_HOSTS, so the probe sends the
      # header the gateway forwards and the first allowed host — otherwise it would get a 301/400.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as u;
          h = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip();
          u.urlopen(u.Request('http://127.0.0.1:8000/admin/login/', headers={'Host': h, 'X-Forwarded-Proto': 'https'}), timeout=4)
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 3
    logging: *logging

  frontend:
    # Prod image; staging overrides it with prokom-tech-frontend-staging (NEXT_PUBLIC_* are baked in
    # at build time, so each environment has its own image).
    image: ghcr.io/krystian2077/prokom-tech-frontend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG (full commit SHA)}
    restart: unless-stopped
    # No env_file: the Next server reads only NEXT_PUBLIC_* (checked in T0), already in the image.
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Next standalone binds to $HOSTNAME, which Docker sets to the container id; 0.0.0.0 makes it
      # reachable from the gateway and from the healthcheck on 127.0.0.1.
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging: *logging

  gateway:
    # Internal router of the stack (no TLS): /static, /media from the volumes, /api and /admin to
    # Django, the rest to Next — the rules of the old nginx/default.conf.
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
    ports:
      # Loopback only: smoke test on the server (scripts/vps/smoke.sh). The public entry is the
      # shared Nginx on the prokom-proxy network.
      - '127.0.0.1:${GATEWAY_PORT:?set GATEWAY_PORT in the env file}:80'
    networks: [default, proxy]
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/gateway-health']
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *logging

networks:
  proxy:
    name: prokom-proxy
    external: true

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  mediafiles:
