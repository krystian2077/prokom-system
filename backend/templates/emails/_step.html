<tr>
  <td width="44" valign="top" style="width:44px; padding:0 0 {% if last %}0{% else %}18{% endif %}px;">

  </td>
  <td valign="top" style="padding:5px 0 {% if last %}0{% else %}18{% endif %}px; font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <p class="em-ink" style="margin:0; font-size:15px; line-height:22px; font-weight:800; color:#121613;">{{ title }}</p>
    {% if text %}<p class="em-ink2" style="margin:3px 0 0; font-size:14px; line-height:22px; color:#4F5650;">{{ text_prefix }}{{ text }}</p>{% endif %}
