# Maintenance page for the OLD server (Hetzner) on switch day — MIGRACJA-VPS §8 pt 1.
# Replaces nginx/default.conf on Hetzner for the time of the move: every request gets 503 with a
# short page (no new data is written from this moment). TLS and the ACME path stay as they were.
# On Hetzner, in /app:
#   cp nginx/default.conf nginx/default.conf.przed-migracja
#   cp eksport/strona-503.conf nginx/default.conf          (this file, copied there with scp)
#   docker compose -f docker-compose.prod.yml exec nginx nginx -t && docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
# Back (rollback, MIGRACJA §9):
#   cp nginx/default.conf.przed-migracja nginx/default.conf && docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

server {
    listen 80;
    server_name prokomserwis.pl www.prokomserwis.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name prokomserwis.pl www.prokomserwis.pl;

    ssl_certificate     /etc/letsencrypt/live/prokomserwis.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prokomserwis.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    error_page 503 @przerwa;

    location / {
        return 503;
    }

    location @przerwa {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        return 503 '<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Przerwa techniczna | PRO-KOM</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120D0C;color:#F6F1F0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}h1{font-size:28px;margin:0 0 12px}a{color:#F29185}</style></head><body><main><h1>Przerwa techniczna</h1><p>Przenosimy stronę i panel na nowy serwer. Wracamy wkrótce.</p><p>Pilne sprawy: <a href="tel:+48883200151">883 200 151</a></p></main></body></html>';
    }
}
