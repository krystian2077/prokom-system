name: Frontend CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  # PRO-KOM Tech: backend and panels must stay untouched (docs/tech/SPEC.md §2).
  strefa-zakazana:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check forbidden zone
        run: bash scripts/tech/strefa-zakazana.sh "origin/${{ github.base_ref }}"
