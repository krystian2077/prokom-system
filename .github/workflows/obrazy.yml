# Images for the VPS (docs/tech/MIGRACJA-VPS.md §4, WDROZENIE.md): built here, never on the server.
#   push to develop → backend + frontend-staging   (staging.prokomserwis.pl)
#   push to master  → backend + frontend           (prokomserwis.pl)
# Tag = full commit SHA (no `latest`); scripts/vps/deploy.sh <stack> <sha> deploys exactly that.
# The frontend has one image per environment because NEXT_PUBLIC_* are baked in at build time;
# their values come from repository Variables (Settings → Secrets and variables → Actions → Variables),
# prefixed per environment: STAGING_NEXT_PUBLIC_{API_URL,SITE_URL,GOOGLE_CLIENT_ID} and
# PRODUCTION_NEXT_PUBLIC_{…}; optional: …_{UMAMI_WEBSITE_ID,UMAMI_SRC,TECH_SW,CSP_REPORT_URI}.
# NEXT_PUBLIC_TECH_DRAFT=1 is set here for staging only (draft frames never on production). Not GitHub Environments: the repo is private on the Free plan, where
# Environments are not available (decision 14.11.2026).
# Packages are private (ghcr.io/krystian2077/prokom-tech-*); the server pulls them with a
# read:packages token. The existing CI (backend-ci.yml, frontend-ci.yml) is unchanged.
# Actions pinned by SHA, the same versions as prokom-gaming/.github/workflows/image.yml.

name: Obrazy

on:
  push:
    branches: [develop, master]
  workflow_dispatch: # rebuild the images of the selected branch's HEAD

concurrency:
  group: obrazy-${{ github.ref }}
  cancel-in-progress: false # every merged commit gets its images

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: backend · push to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ghcr.io/krystian2077/prokom-tech-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: frontend (${{ github.ref_name == 'master' && 'production' || 'staging' }}) · push to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Full names on both sides: in GitHub expressions '' is falsy, so `cond && '' || '-staging'`
      # always gave -staging (the first master build, 3e7e04f, went to prokom-tech-frontend-staging).
      IMAGE: ${{ github.ref_name == 'master' && 'ghcr.io/krystian2077/prokom-tech-frontend' || 'ghcr.io/krystian2077/prokom-tech-frontend-staging' }}
    steps:
      - name: Pick build variables for the environment
        id: build
        env:
          PREFIX: ${{ github.ref_name == 'master' && 'PRODUCTION' || 'STAGING' }}
          PROD_API: ${{ vars.PRODUCTION_NEXT_PUBLIC_API_URL }}
          PROD_SITE: ${{ vars.PRODUCTION_NEXT_PUBLIC_SITE_URL }}
          PROD_GOOGLE: ${{ vars.PRODUCTION_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          STG_API: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          STG_SITE: ${{ vars.STAGING_NEXT_PUBLIC_SITE_URL }}
          STG_GOOGLE: ${{ vars.STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          # Optional: Umami (unset = no analytics), TECH_SW=0 = service worker kill switch, CSP report endpoint.
          PROD_UMAMI_ID: ${{ vars.PRODUCTION_NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          PROD_UMAMI_SRC: ${{ vars.PRODUCTION_NEXT_PUBLIC_UMAMI_SRC }}
          PROD_SW: ${{ vars.PRODUCTION_NEXT_PUBLIC_TECH_SW }}
          PROD_CSP: ${{ vars.PRODUCTION_NEXT_PUBLIC_CSP_REPORT_URI }}
          STG_UMAMI_ID: ${{ vars.STAGING_NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          STG_UMAMI_SRC: ${{ vars.STAGING_NEXT_PUBLIC_UMAMI_SRC }}
          STG_SW: ${{ vars.STAGING_NEXT_PUBLIC_TECH_SW }}
          STG_CSP: ${{ vars.STAGING_NEXT_PUBLIC_CSP_REPORT_URI }}
        run: |
          if [ "$PREFIX" = PRODUCTION ]; then api="$PROD_API" site="$PROD_SITE" google="$PROD_GOOGLE"
            umami_id="$PROD_UMAMI_ID" umami_src="$PROD_UMAMI_SRC" sw="$PROD_SW" csp="$PROD_CSP"
            draft="" # draft frames never reach production
          else api="$STG_API" site="$STG_SITE" google="$STG_GOOGLE"
            umami_id="$STG_UMAMI_ID" umami_src="$STG_UMAMI_SRC" sw="$STG_SW" csp="$STG_CSP"
            draft=1 # staging shows the draft frames (unpublished points, unverified content)
          fi
          # An image without the API address would talk to localhost in the browser — fail early.
          [ -n "$api" ] && [ -n "$site" ] || {
            echo "::error::Set repository Variables ${PREFIX}_NEXT_PUBLIC_API_URL and ${PREFIX}_NEXT_PUBLIC_SITE_URL"
            exit 1
          }
          {
            echo "api=$api"; echo "site=$site"; echo "google=$google"
            echo "umami_id=$umami_id"; echo "umami_src=$umami_src"; echo "sw=$sw"; echo "csp=$csp"
            echo "draft=$draft"; echo "build_date=$(date -u +%Y-%m-%d)"
          } >>"$GITHUB_OUTPUT"
          echo "Building $IMAGE for $site"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.build.outputs.api }}
            NEXT_PUBLIC_SITE_URL=${{ steps.build.outputs.site }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ steps.build.outputs.google }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ steps.build.outputs.umami_id }}
            NEXT_PUBLIC_UMAMI_SRC=${{ steps.build.outputs.umami_src }}
            NEXT_PUBLIC_TECH_SW=${{ steps.build.outputs.sw }}
            NEXT_PUBLIC_CSP_REPORT_URI=${{ steps.build.outputs.csp }}
            NEXT_PUBLIC_TECH_DRAFT=${{ steps.build.outputs.draft }}
            BUILD_DATE=${{ steps.build.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}
