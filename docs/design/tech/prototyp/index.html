  if(h[0]==='#'){e.preventDefault();const id=h.slice(1);if(BYHASH[id]){if(location.hash!=='#'+id){location.hash=id;}else{window.scrollTo({top:0,behavior:'smooth'});}return;}
    const t=document.getElementById(id);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(/^(tel:|mailto:)/.test(h)){e.preventDefault();}
});
document.addEventListener('submit',(e)=>e.preventDefault());
window.addEventListener('hashchange',go);window.addEventListener('resize',fit);fit();go();

</script>
