# Internal router of the prokom-tech stack (compose.vps.yml → gateway). No TLS here: TLS ends in
# the shared Nginx of prokom-web, which proxies plain HTTP to prokom-tech-<stack>-gateway-1:80.
# Routing = the old nginx/default.conf (Hetzner) without the TLS parts:
#   /static/, /media/ → volumes · /api/, /admin/ → Django · everything else → Next.js

# Names of the stack's services are resolved per request (Docker DNS), so the gateway starts and
# keeps running even while backend or frontend restarts during a deploy.
resolver 127.0.0.11 valid=10s ipv6=off;

# X-Forwarded-Proto MUST come from the shared Nginx, not from $scheme: inside the stack the request
# is plain http. Django has SECURE_SSL_REDIRECT=True and trusts this header
# (SECURE_PROXY_SSL_HEADER); with $scheme every request would look like http and get a 301 to
# https → redirect loop. Without the header (smoke test on the loopback port, curl by hand) we send
# http, so Django behaves exactly as for a plain-http request.
map $http_x_forwarded_proto $tech_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Client IP as set by the shared Nginx (it overwrites X-Forwarded-For with $remote_addr), so
# Django and DRF throttling see the visitor, like on Hetzner. Direct calls fall back to the peer.
map $http_x_forwarded_for $tech_forwarded_for {
    default $http_x_forwarded_for;
    ''      $remote_addr;
}
map $http_x_real_ip $tech_real_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

# Audit AB4 (T-13): login to the Django admin — per visitor IP (X-Real-IP from the shared Nginx;
# the peer address here is always that Nginx). Django has no lockout of its own on /admin/login/.
limit_req_zone $tech_real_ip zone=tech_admin_login:1m rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    # Uploads in the panel (photos, documents) — same limit as on Hetzner and in the shared Nginx vhost.
    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tech_real_ip;
    proxy_set_header X-Forwarded-For $tech_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tech_forwarded_proto;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_read_timeout 60s;

    set $django backend:8000;
    set $nextjs frontend:3000;

    # Healthcheck of this container only (compose.vps.yml).
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django static files (collectstatic in scripts/vps/deploy.sh).
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media (uploads from the panel).
    location /media/ {
        alias /app/media/;
        expires 7d;
        # Audit AB4 (T-06): uploads are served from the site's own origin — never let a browser
        # sniff an uploaded file into HTML or script.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://$django;
    }

    location = /admin/login/ {
        limit_req zone=tech_admin_login burst=5 nodelay;
        proxy_pass http://$django;
    }

    location /admin/ {
        proxy_pass http://$django;
    }

    location / {
        proxy_pass http://$nextjs;
    }
}
